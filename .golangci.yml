version: "2"
run:
    timeout: 5m
    go: "1.25"
    build-tags: []
    modules-download-mode: readonly
    allow-parallel-runners: true
    allow-serial-runners: false
    issues-exit-code: 1
    tests: true
output:
    formats: {}
linters:
    enable:
        - unconvert
        - dupword
        - makezero
        - mirror
        - errcheck
        - dupl
        - misspell
        - funcorder
        - testpackage
        - ginkgolinter
        - inamedparam
        - wrapcheck
        - copyloopvar
        - forbidigo
        - prealloc
        - cyclop
        - grouper
        - whitespace
        - govet
        - promlinter
        - ineffassign
        - fatcontext
        - godot
        - gochecksumtype
        - unparam
        - gocritic
        - testifylint
        - sloglint
        - nakedret
        - gomodguard
        - unused
        - bodyclose
        - durationcheck
        - spancheck
        - gocyclo
        - canonicalheader
        - nolintlint
        - gocognit
        - bidichk
        - rowserrcheck
        - perfsprint
        - gochecknoglobals
        - ireturn
        - goprintffuncname
        - gochecknoinits
        - embeddedstructfieldcheck
        - sqlclosecheck
        - iface
        - tagliatelle
        - unqueryvet
        - varnamelen
        - tagalign
        - nosprintfhostport
        - zerologlint
        - recvcheck
        - usestdlibvars
        - nonamedreturns
        - contextcheck
        - protogetter
        - godox
        - nilnesserr
        - noctx
        - errorlint
        - nestif
        - revive
        - loggercheck
        - gosec
        - goconst
        - interfacebloat
        - testableexamples
        - nilerr
        - mnd
        - modernize
        - funlen
        - decorder
        - intrange
        - tparallel
        - usetesting
        - lll
        - exhaustive
        - wastedassign
        - thelper
        - containedctx
        - godoclint
        - importas
        - gomoddirectives
        - maintidx
        - staticcheck
        - asasalint
issues: {}
