version: "2"
run:
  timeout: 5m
  go: "1.25"
  build-tags: []
  modules-download-mode: readonly
  allow-parallel-runners: true
  allow-serial-runners: false
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - depguard
    - gosmopolitan
    - nonamedreturns
    - iface
    - exhaustruct
    - makezero
    - unused
    - unconvert
    - decorder
    - dupl
    - modernize
    - revive
    - err113
    - noinlineerr
    - perfsprint
    - predeclared
    - godot
    - gocyclo
    - embeddedstructfieldcheck
    - lll
    - rowserrcheck
    - forcetypeassert
    - tparallel
    - gomoddirectives
    - varnamelen
    - protogetter
    - godoclint
    - prealloc
    - nosprintfhostport
    - gomodguard
    - nestif
    - canonicalheader
    - mnd
    - nilnesserr
    - spancheck
    - staticcheck
    - gocritic
    - sqlclosecheck
    - asasalint
    - unqueryvet
    - godox
    - containedctx
    - govet
    - fatcontext
    - thelper
    - gochecknoinits
    - funcorder
    - dupword
    - goprintffuncname
    - mirror
    - wsl_v5
    - funlen
    - bodyclose
    - contextcheck
    - testifylint
    - usetesting
    - gochecknoglobals
    - errorlint
    - exptostd
    - noctx
    - nilnil
    - loggercheck
    - forbidigo
    - goheader
    - gocognit
    - interfacebloat
    - nolintlint
    - tagliatelle
    - paralleltest
    - inamedparam
    - grouper
    - nlreturn
    - testpackage
    - zerologlint
    - importas
    - goconst
    - dogsled
    - misspell
    - tagalign
    - wastedassign
    - asciicheck
    - errname
    - gochecksumtype
    - maintidx
    - sloglint
    - reassign
    - wrapcheck
    - gocheckcompilerdirectives
    - promlinter
    - durationcheck
    - ginkgolinter
    - arangolint
    - whitespace
    - usestdlibvars
    - nakedret
    - testableexamples
    - bidichk
    - nilerr
    - ineffassign
    - intrange
    - recvcheck
    - gosec
    - errcheck
    - cyclop
    - exhaustive
    - ireturn
    - copyloopvar
    - iotamixing
    - unparam
formatters:
  enable:
    - golines
issues: {}
