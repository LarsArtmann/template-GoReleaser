# GoReleaser-Wizard Architecture Enforcement
# Clean Architecture with Domain-Driven Design

version: 3
workdir: .

# Allow vendor dependencies
allow:
  depOnAnyVendor: true
  deepScan: false

# Architectural Components
components:
  # Main CLI Application
  cmd:
    in: cmd/**

  # Domain Layer - Pure Business Logic
  domain:
    in: internal/domain/**

  # Validation Layer
  validation:
    in: internal/validation/**

  # Types
  types:
    in: internal/types/**

  # Configuration
  config:
    in: internal/config/**

  # Infrastructure - Git Operations
  git:
    in: internal/git/**

  # Utilities
  utils:
    in: internal/utils/**

# Dependency Rules
deps:
  # Main application - complete freedom (includes generators, jobs, templates, types)
  cmd:
    anyProjectDeps: true
    anyVendorDeps: true

  # Domain layer - Pure business logic, minimal dependencies
  domain:
    anyVendorDeps: true
    mayDependOn:
      - types

  # Validation can depend on domain
  validation:
    anyVendorDeps: true
    mayDependOn:
      - domain
      - types

  # Types - pure data structures
  types:
    anyVendorDeps: true
    mayDependOn:
      - domain

  # Configuration
  config:
    anyVendorDeps: true
    mayDependOn: []

  # Git operations
  git:
    anyVendorDeps: true
    mayDependOn:
      - domain

  # Utilities
  utils:
    anyVendorDeps: true
    mayDependOn:
      - domain
      - git

# Exclusion Patterns
exclude:
  - "**/*.pb.go"
  - "**/*_generated.go"
  - "**/*_gen.go"
  - "**/*_templ.go"
  - "**/mock_*.go"
  - "**/testdata/**"
  - "**/vendor/**"
  - "**/bin/**"
  - "**/build/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/docs/**"
  - "**/examples/**"
  - "**/*.md"
  - "**/.git/**"
  - "**/.github/**"
  - "**/.vscode/**"
  - "**/.idea/**"
  - "**/*.swp"
  - "**/.DS_Store"

  # Exclude test projects
  - "test-wizard/**"
  - "templates/**"

# Test files excluded from architecture validation
excludeFiles:
  - ".*_test\\.go$"
  - "integration_test\\.go$"
  - ".*_integration_test\\.go$"
