# GoReleaser configuration
# Generated by goreleaser-wizard
# https://goreleaser.com

version: 2

project_name: test-github-actions

before:
  hooks:
    - go mod tidy
    - go generate ./...
    - go test ./...

builds:
  - id: GoReleaser-Wizard
    main: .
    binary: GoReleaser-Wizard

    env:
      - CGO_ENABLED=

    goos:
      - linux
      - darwin
      - windows

    goarch:
      - amd64
      - arm64

    # Ignore certain platform combinations
    ignore:
      - goos: darwin
        goarch: 386
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: "test-github-actions_81d04b0-dirty_{{.Os}}_{{.Arch}}"

    format_overrides:
      - goos: windows
        format: zip

    files:
      - LICENSE*
      - README*
      - CHANGELOG*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "81d04b0-dirty-next-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: "LarsArtmann"
    name: "GoReleaser-Wizard"

  draft: false
  prerelease: auto
  mode: append

  footer: |
    ## Installation
    Download the appropriate archive for your platform from the assets below.

dockers:
  - image_templates:
      - "GitHub Container Registry/test-github-actions:81d04b0-dirty"
      - "GitHub Container Registry/test-github-actions:v81d04b0-dirty"
      - "GitHub Container Registry/test-github-actions:latest"

    dockerfile: Dockerfile

    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created=2025-12-13"
      - "--label=org.opencontainers.image.title=test-github-actions"
      - "--label=org.opencontainers.image.revision=81d04b0becd20783ad978d57cc1aee7f9242b0c8"
      - "--label=org.opencontainers.image.version=81d04b0-dirty"
      - "--platform=linux/amd64"
