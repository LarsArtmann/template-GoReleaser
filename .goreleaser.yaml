# GoReleaser configuration
# Documentation: https://goreleaser.com

version: 2

project_name: GoReleaser-Wizard

before:
  hooks:
    - go mod tidy

builds:
  - id: goreleaser-wizard
    main: ./cmd/goreleaser-wizard
    binary: goreleaser-wizard
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: 386
      - goos: windows
        goarch: arm64
    tags:
      - netgo
      - osusergo
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
        {{- else if eq .Arch "386" }}i386
        {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*
      - CHANGELOG*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: all
    output: true

sboms:
  - artifacts: archive

homebrew_casks:
  - name: goreleaser-wizard
    binaries:
      - goreleaser-wizard
    skip_upload: true
    homepage: https://github.com/LarsArtmann/GoReleaser-Wizard
    description: "Interactive setup wizard that creates perfect GoReleaser configurations"
    repository:
      owner: LarsArtmann
      name: homebrew-tap
    directory: Casks
    commit_author:
      name: goreleaserbot
      email: goreleaser@larsartmann.com
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/goreleaser-wizard"]
          end

dockers_v2:
  - id: goreleaser-wizard
    images:
      - ghcr.io/larsartmann/goreleaser-wizard
    tags:
      - "{{.Tag}}"
      - "v{{.Major}}"
      - "v{{.Major}}.{{.Minor}}"
      - "{{if not .IsNightly}}latest{{end}}"
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    annotations:
      org.opencontainers.image.created: "{{.Date}}"
      org.opencontainers.image.title: "{{.ProjectName}}"
      org.opencontainers.image.revision: "{{.FullCommit}}"
      org.opencontainers.image.version: "{{.Version}}"
      org.opencontainers.image.source: "{{.GitURL}}"

nfpms:
  - id: default
    package_name: goreleaser-wizard
    file_name_template: "{{ .ConventionalFileName }}"
    homepage: https://github.com/LarsArtmann/GoReleaser-Wizard
    description: "Interactive setup wizard for GoReleaser configurations"
    license: MIT
    maintainer: "Lars Artmann <lars@larsartmann.com>"
    formats:
      - deb
      - rpm
      - apk
    contents:
      - src: LICENSE
        dst: /usr/share/doc/goreleaser-wizard/LICENSE
      - src: README.md
        dst: /usr/share/doc/goreleaser-wizard/README.md
    deb:
      fields:
        Bugs: https://github.com/LarsArtmann/GoReleaser-Wizard/issues
nix:
  - name: goreleaser-wizard
    skip_upload: auto
    repository:
      owner: LarsArtmann
      name: nur-packages
    homepage: https://github.com/LarsArtmann/GoReleaser-Wizard
    description: "Interactive setup wizard for GoReleaser configurations"
    license: mit
    formatter: nixfmt
    path: pkgs/goreleaser-wizard/default.nix
    install: |
      mkdir -p $out/bin
      cp -vr ./{binary} $out/bin/goreleaser-wizard

scoops:
  - name: goreleaser-wizard
    skip_upload: true
    repository:
      owner: LarsArtmann
      name: homebrew-tap
    directory: Scoop
    commit_author:
      name: goreleaserbot
      email: goreleaser@larsartmann.com
    homepage: "https://github.com/LarsArtmann/GoReleaser-Wizard"
    description: "Interactive setup wizard for GoReleaser configurations"
    license: MIT

release:
  github:
    owner: LarsArtmann
    name: GoReleaser-Wizard
  draft: false
  prerelease: auto
  name_template: "GoReleaser-Wizard v{{.Version}}"
  footer: |
    ## Installation

    **Homebrew:**
    ```bash
    brew tap LarsArtmann/tap
    brew install goreleaser-wizard
    ```

    **Nix:**
    ```bash
    nix run github:LarsArtmann/nur-packages#goreleaser-wizard
    ```

    **Go Install:**
    ```bash
    go install github.com/LarsArtmann/GoReleaser-Wizard@{{.Version}}
    ```

    **Docker:**
    ```bash
    docker pull ghcr.io/larsartmann/goreleaser-wizard:{{.Version}}
    ```

    Download the appropriate binary for your platform from the assets below.
