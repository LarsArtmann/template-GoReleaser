# GoReleaser configuration
# Generated by goreleaser-wizard
# https://goreleaser.com

version: 2

project_name: GoReleaser-Wizard

before:
  hooks:
    - go mod tidy
    - go generate ./...
    - go test ./...

builds:
  - id: goreleaser-wizard
    main: ./cmd/goreleaser-wizard
    binary: goreleaser-wizard
    
    env:
      - CGO_ENABLED=Unknown
    
    goos:
      - Linux
      - macOS
      - Windows

    goarch:
      - 64-bit x86
      - 64-bit ARM


    # Ignore certain platform combinations
    ignore:
      - goos: darwin
        goarch: 386
      - goos: windows
        goarch: arm64



archives:
  - id: default
    name_template: "GoReleaser-Wizard_83b809c-dirty_{{.Os}}_{{.Arch}}"
    
    format_overrides:
      - goos: windows
        format: zip
    
    files:
      - LICENSE*
      - README*
      - CHANGELOG*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "83b809c-dirty-next-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: "LarsArtmann"
    name: "GoReleaser-Wizard"
  
  draft: false
  prerelease: auto
  mode: append
  
  footer: |
    ## Installation
    Download the appropriate archive for your platform from the assets below.


dockers:
  - image_templates:
      - "GitHub Container Registry/goreleaser-wizard:83b809c-dirty"
      - "GitHub Container Registry/goreleaser-wizard:v83b809c-dirty"
      - "GitHub Container Registry/goreleaser-wizard:latest"
    
    dockerfile: Dockerfile
    
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created=2025-12-12"
      - "--label=org.opencontainers.image.title=GoReleaser-Wizard"
      - "--label=org.opencontainers.image.revision=83b809cbb10872ab9960304a1b80f3b6895ca1fe"
      - "--label=org.opencontainers.image.version=83b809c-dirty"
      - "--platform=linux/amd64"

