# GoReleaser configuration
# Generated by goreleaser-wizard
# https://goreleaser.com

version: 2

project_name: GoReleaser-Wizard

before:
  hooks:
    - go mod tidy
    - go generate ./...
    - go test ./...

builds:
  - id: GoReleaser-Wizard
    main: .
    binary: GoReleaser-Wizard

    env:
      - CGO_ENABLED=0

    goos:
      - linux
      - darwin
      - windows

    goarch:
      - amd64
      - arm64

    # Ignore certain platform combinations
    ignore:
      - goos: darwin
        goarch: 386
      - goos: windows
        goarch: arm64

    # Build tags for pure Go builds
    tags:
      - pure

archives:
  - id: default
    name_template: "GoReleaser-Wizard_7e85f9e-dirty_{{.Os}}_{{.Arch}}"

    format_overrides:
      - goos: windows
        format: zip

    files:
      - LICENSE*
      - README*
      - CHANGELOG*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "7e85f9e-dirty-next-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: "LarsArtmann"
    name: "GoReleaser-Wizard"

  draft: false
  prerelease: auto
  mode: append

  footer: |
    ## Installation
    Download the appropriate archive for your platform from the assets below.

dockers:
  - image_templates:
      - "GitHub Container Registry/goreleaser-wizard:7e85f9e-dirty"
      - "GitHub Container Registry/goreleaser-wizard:v7e85f9e-dirty"
      - "GitHub Container Registry/goreleaser-wizard:latest"

    dockerfile: Dockerfile

    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created=2026-03-20"
      - "--label=org.opencontainers.image.title=GoReleaser-Wizard"
      - "--label=org.opencontainers.image.revision=7e85f9e384d955adf1438806eab6930e62f415e0"
      - "--label=org.opencontainers.image.version=7e85f9e-dirty"
      - "--platform=linux/amd64"
