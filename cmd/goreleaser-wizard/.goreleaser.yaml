# GoReleaser configuration
# Generated by goreleaser-wizard
# https://goreleaser.com

version: 2

project_name: concurrent-test-3

before:
  hooks:
    - go mod tidy
    - go generate ./...
    - go test ./...

builds:
  - id: concurrent-test-3
    main: .
    binary: concurrent-test-3

    env:
      - CGO_ENABLED=0

    goos:

    goarch:

    # Ignore certain platform combinations
    ignore:
      - goos: darwin
        goarch: 386
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: "concurrent-test-3_v0.1.0_{{.Os}}_{{.Arch}}"

    format_overrides:
      - goos: windows
        format: zip

    files:
      - LICENSE*
      - README*
      - CHANGELOG*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "v0.1.1-next-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: "owner"
    name: "repo"

  draft: false
  prerelease: auto
  mode: append

  footer: |
    ## Installation
    Download the appropriate archive for your platform from the assets below.
